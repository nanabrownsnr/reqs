services:
  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agentdb

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

  app:
    build: .

    depends_on:
      - postgres

    env_file:
      - .env

    volumes:
      - tenant_data:/app/data

    environment:
      DATABASE_URL: postgresql://agent:agent@postgres:5432/agentdb
      OPENROUTER_URL: https://openrouter.ai/api/v1
      OPENROUTER_MODEL: openrouter/free
      PUBLIC_URL: https://your-public-domain.com
      USERS_FILE_PATH: /app/data/users.json

    restart: unless-stopped

volumes:
  postgres_data:

  tenant_data:
